name: content-publish

# One reviewed article per week. CONTENT_PIPELINE=true enables this workflow.
# Lint checks do not replace factual/editorial review. Merge the PR to publish.
on:
  schedule:
    - cron: "0 14 * * 3" # Wednesday 08:00 America/Regina
  workflow_dispatch:
    inputs:
      slug:
        description: "Specific queue slug to draft (optional)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.CONTENT_PIPELINE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check for a pending review and queued work
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ "$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("content/weekly-draft-") or startswith("content/auto-"))] | length')" != "0" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const queue = JSON.parse(readFileSync('content/queue.json', 'utf8'));
          const item = queue.find(item => item.status === 'queued' && (!process.env.SLUG || item.slug === process.env.SLUG));
          if (item && !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(item.slug)) throw new Error('Invalid queue slug');
          appendFileSync(process.env.GITHUB_OUTPUT, `ready=${Boolean(item)}\nslug=${item?.slug ?? ''}\n`);
          JS
      - name: Draft one article
        if: steps.queue.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          SLUG: ${{ steps.queue.outputs.slug }}
        run: node scripts/content/draft.mjs --slug "$SLUG"
      - name: Prepare content for review
        if: steps.queue.outputs.ready == 'true'
        env:
          SLUG: ${{ steps.queue.outputs.slug }}
        run: node scripts/content/publish.mjs "$SLUG" --no-notify
      - name: Open review PR
        if: steps.queue.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain content/)" ]; then
            echo "No content changes"; exit 0
          fi
          git config user.name "scanstone-bot"
          git config user.email "bot@scanstone.ca"
          BRANCH="content/weekly-draft-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A content/
          git commit -m "content: weekly draft for editorial review"
          git push -u origin "$BRANCH"
          cat > "$RUNNER_TEMP/content-pr.md" <<'BODY'
          Review this draft before merging. Verify product behavior, all external claims and their dates, internal links, and whether the page adds original value. Mechanical lint is not fact-checking.

          Merge publishes through the existing Vercel integration. Search-engine notifications must happen only after the deployed URL returns successfully.
          BODY
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "Content: weekly draft for review" --body-file "$RUNNER_TEMP/content-pr.md"
